name: FreeBSD

on:
  schedule:
    - cron: '27 4 * * *'
  push:
    branches: [release]
  pull_request:
    paths: ['crates/fonts/**', '.github/workflows/freebsd.yml', 'packaging/freebsd/**', 'packaging/env.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD workspace build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: .release-fonts
          persist-credentials: false
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          cpu: 4
          mem: 12288
          copyback: false
          prepare: |
            pkg install -y bash git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -eu
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "$PWD"
            export CARGO_PROFILE_DEV_DEBUG=0 CARGO_BUILD_JOBS=4
            export CRAFT_FONTS_DIR="$PWD/.release-fonts" CRAFT_FONTS_REQUIRED=1
            cargo build --workspace --all-targets --locked
            cargo test --workspace --locked
