name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override for this build (empty: Cargo.toml)'
        type: string
        default: ''
      unsigned-test:
        description: 'Build unsigned test artifacts only; never create a GitHub release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'
  RUST_BACKTRACE: '1'

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      date: ${{ steps.version.outputs.date }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Resolve validated product version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import datetime, os, re, tomllib
          with open('Cargo.toml', 'rb') as source:
              configured = tomllib.load(source)['workspace']['package']['version']
          version = os.environ.get('INPUT_VERSION') or configured
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', version):
              raise SystemExit('release version must be X.Y.Z or X.Y.Z-prerelease')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f'version={version}', file=out)
              print(f'date={datetime.datetime.now(datetime.timezone.utc).date()}', file=out)
              print(f'prerelease={str("-" in version).lower()}', file=out)
          PY

  macos:
    name: macOS universal
    needs: [quality, version]
    runs-on: macos-15
    timeout-minutes: 180
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos-universal
      - uses: ./.github/actions/release-setup
        with:
          version: ${{ needs.version.outputs.version }}
          date: ${{ needs.version.outputs.date }}
          override-version: ${{ inputs.version != '' }}
      - name: Require production signing and notarization credentials
        if: inputs.unsigned-test != true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Required release credential is missing: $name"; exit 1; fi
          done
      - name: Import signing identity
        if: inputs.unsigned-test != true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Build, package and verify signatures
        env:
          APPLE_ID: ${{ inputs.unsigned-test != true && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.unsigned-test != true && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.unsigned-test != true && secrets.APPLE_TEAM_ID || '' }}
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN"; fi

  windows:
    name: Windows ${{ matrix.arch }}
    needs: [quality, version]
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, target: x86_64-pc-windows-msvc}
          - {arch: x86, target: i686-pc-windows-msvc}
          - {arch: arm64, target: aarch64-pc-windows-msvc}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-${{ matrix.arch }}
      - uses: ./.github/actions/release-setup
        with:
          version: ${{ needs.version.outputs.version }}
          date: ${{ needs.version.outputs.date }}
          override-version: ${{ inputs.version != '' }}
      - name: Install pinned WiX and extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require production signing credentials
        if: inputs.unsigned-test != true
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          $azureNames = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE'
          $azureReady = -not ($azureNames | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if (-not $env:WINDOWS_CERTIFICATE -and -not $azureReady) { throw 'Production builds require WINDOWS_CERTIFICATE or every Azure signing credential.' }
      - name: Build, sign, package and verify architecture
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ inputs.unsigned-test != true && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.unsigned-test != true && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ inputs.unsigned-test != true && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ inputs.unsigned-test != true && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ inputs.unsigned-test != true && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ inputs.unsigned-test != true && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ inputs.unsigned-test != true && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_CERT_PROFILE: ${{ inputs.unsigned-test != true && secrets.AZURE_CERT_PROFILE || '' }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: [quality, version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, deb: amd64, runner: ubuntu-22.04}
          - {arch: aarch64, deb: arm64, runner: ubuntu-22.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config cmake libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev \
            libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers desktop-file-utils appstream zsync
      # Reviewed install-only helpers are pinned; all product/release orchestration belongs here.
      - uses: storytold/craft-common-actions/actions/install-nfpm@f0808a5ccbc32869248193ffab0de98d733de451
        with:
          nfpm-version: '2.47.0'
          deb-arch: ${{ matrix.deb }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-${{ matrix.arch }}
      - uses: ./.github/actions/release-setup
        with:
          version: ${{ needs.version.outputs.version }}
          date: ${{ needs.version.outputs.date }}
          override-version: ${{ inputs.version != '' }}
      - name: Build and package AppImage, deb, rpm and tarball
        run: packaging/linux/package.sh
      - name: Validate packaged files and executable
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep 'usr/bin/not-word-cli'
          for image in dist/release/*.AppImage; do
            chmod +x "$image"
            APPIMAGE_EXTRACT_AND_RUN=1 "$image" --version
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [version, linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    env:
      NOT_WORD_VERSION: ${{ needs.version.outputs.version }}
      NOT_WORD_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
      - name: Bundle, install and run CLI in the sandbox
        run: packaging/linux/flatpak-bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: error

  linux-riscv64:
    name: Linux RISC-V 64
    needs: [quality, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-riscv64
      - uses: ./.github/actions/release-setup
        with:
          version: ${{ needs.version.outputs.version }}
          date: ${{ needs.version.outputs.date }}
          override-version: ${{ inputs.version != '' }}
      - uses: storytold/craft-common-actions/actions/install-riscv64-cross@f0808a5ccbc32869248193ffab0de98d733de451
      - uses: storytold/craft-common-actions/actions/install-nfpm@f0808a5ccbc32869248193ffab0de98d733de451
        with:
          nfpm-version: '2.47.0'
          deb-arch: amd64
      - name: Build and package deb, rpm and tarball
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /
          PKG_CONFIG_PATH: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: '1'
          CROSS_ARCH: riscv64
          CROSS_TARGET: riscv64gc-unknown-linux-gnu
          CROSS_COMPILE: riscv64-linux-gnu-
          EMULATOR: qemu-riscv64
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
        run: packaging/linux/package.sh --formats 'deb rpm tar'
      - name: Validate RISC-V package metadata
        run: |
          dpkg-deb --info dist/release/*-linux-riscv64.deb
          dpkg-deb --contents dist/release/*-linux-riscv64.deb | grep 'usr/bin/not-word-cli'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-riscv64
          path: dist/release/*
          if-no-files-found: error

  freebsd:
    name: FreeBSD x86_64
    needs: [quality, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NOT_WORD_VERSION: ${{ needs.version.outputs.version }}
      NOT_WORD_BUILD_DATE: ${{ needs.version.outputs.date }}
      NOT_WORD_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: .release-fonts
          persist-credentials: false
      - name: Build and package inside FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          cpu: 4
          mem: 12288
          envs: 'NOT_WORD_VERSION NOT_WORD_BUILD_DATE NOT_WORD_BUILD_SHA'
          prepare: |
            pkg install -y bash git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -eu
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "$PWD"
            export CARGO_TARGET_DIR=/var/tmp/not-word-target CARGO_BUILD_JOBS=4
            export CRAFT_FONTS_DIR="$PWD/.release-fonts" CRAFT_FONTS_REQUIRED=1
            # This checkout exists only for the release build; keep binary versions consistent.
            cargo run --locked -p xtask -- version set "$NOT_WORD_VERSION"
            bash packaging/freebsd/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-freebsd-x86_64
          path: dist/release/*
          if-no-files-found: error

  web:
    name: Browser
    needs: [quality, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-web
      - uses: ./.github/actions/release-setup
        with:
          version: ${{ needs.version.outputs.version }}
          date: ${{ needs.version.outputs.date }}
          override-version: ${{ inputs.version != '' }}
      - uses: storytold/craft-common-actions/actions/install-trunk@f0808a5ccbc32869248193ffab0de98d733de451
        with:
          trunk-version: '0.21.14'
      - name: Build static browser package
        run: packaging/web/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/release/*.zip
          if-no-files-found: error

  draft:
    name: Assemble independent draft release
    needs: [quality, version, macos, windows, linux, flatpak, linux-riscv64, freebsd, web]
    if: inputs.unsigned-test != true
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Hash all artifacts and save draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # Reusing an upstream tag would associate these artifacts with the wrong source commit.
          existing_refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$RELEASE_VERSION" --jq '.[].ref')"
          if grep -Fxq "refs/tags/v$RELEASE_VERSION" <<< "$existing_refs"; then
            echo "::error::v$RELEASE_VERSION already exists; choose a new product version rather than replacing a published tag."
            exit 1
          fi
          (cd dist/release && sha256sum not-word-* > SHA256SUMS)
          python3 packaging/release_notes.py "$RELEASE_VERSION" > "$RUNNER_TEMP/not-word-release.md"
          args=(--draft --title "Not Word $RELEASE_VERSION" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/not-word-release.md")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" dist/release/* "${args[@]}"
