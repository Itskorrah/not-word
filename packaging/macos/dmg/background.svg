<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <title>Not Word installation background</title>
  <desc>Original teal geometric artwork beside an arrow from the application to Applications. No fonts are required.</desc>
  <defs><clipPath id="panel"><rect width="232" height="400"/></clipPath></defs>
  <rect width="660" height="400" fill="#f5f3eb"/>
  <g clip-path="url(#panel)">
    <rect width="232" height="400" fill="#103c40"/>
    <circle cx="22" cy="62" r="184" fill="#185354"/>
    <circle cx="231" cy="361" r="158" fill="#1a837b"/>
    <path d="M-22 347 244 81M-22 373 244 107" stroke="#55b7a1" stroke-width="3" opacity=".32"/>
    <image href="../../../assets/app-icon/not-word.svg" x="30" y="125" width="172" height="172"/>
