<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <title>Not Word installation background</title>
  <desc>The approved monochrome Not Word wordmark on a light background, with an arrow from the application to Applications. No installed fonts are required.</desc>
  <rect width="660" height="400" fill="#f8f8f8"/>
  <!-- Link the canonical lockup so the installer follows the approved logo exactly. -->
  <image href="../../../docs/brand/not-word-logo.svg" x="36" y="34" width="380" height="70" preserveAspectRatio="xMinYMid meet"/>
  <path d="M36 122H624" fill="none" stroke="#dedede"/>
  <!-- Finder draws both 128 pt app icons and their labels in this clear light area. -->
  <path d="M418 205H477M463 190 478 205 463 220" fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 336H624" fill="none" stroke="#dedede"/>
</svg>
