    <g transform="translate(33 45)" fill="none" stroke="#f5f3eb" stroke-width="3.6" stroke-linejoin="round">
      <path d="M0 23V0L17 23V0M25 0H42V23H25ZM50 0H71M60.5 0V23"/>
